exclude: .*/Baseline

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files

- repo: https://github.com/maxwinterstein/shfmt-py
  rev: 259c873d8ebd3f0c90052cf29b5cb829391bc1b3  # frozen: v4.2.0
  hooks:
  - id: shfmt
    args: [-w, -i, '4', -ci]

- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
  hooks:
  - id: shellcheck

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
  hooks:
  - id: ruff-format
  - id: ruff
    args: [--fix]

- repo: local
  hooks:
  - id: stray_baselines
    name: Check for stray BTest baselines
    entry: ./tests/scripts/stray_baselines.py
    language: python
    pass_filenames: false
    additional_dependencies:
    - btest

- repo: https://github.com/crate-ci/typos
  rev: 276087d9a4f06398b3e04825487805e2d7375888  # frozen: v1.52.2
  hooks:
  - id: typos
